<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tudo com Laser | Links</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: '#000000', /* Preto puro para combinar com a logo */
                        bgCard: '#0A0A0A', 
                        brandGold: '#FFB300', /* Amarelo/Laranja vibrante extraído da logo */
                        whatsapp: '#25D366',
                        tiktok: '#FE2C55',
                        instagram: '#E1306C'
                    },
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #000000;
            color: #F8FAFC;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            /* Gradiente de fundo com o novo amarelo */
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 179, 0, 0.15) 0%, transparent 50%);
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04; 
            pointer-events: none;
            z-index: 0;
        }

        /* --- BOTÕES PREMIUM --- */
        .link-btn {
            --brand-color: #FFB300; /* Dourado padrão */
            --brand-color-rgb: 255, 179, 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 16px;
            width: 100%;
            padding: 18px 24px;
            border-radius: 16px;
            font-weight: 500;
            font-size: 15px;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.4s ease, background 0.4s ease;
            opacity: 0.5;
            cursor: pointer;
            text-align: left;
        }

        .link-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.05);
        }
        .link-btn:active {
            transform: scale(0.98);
        }

        /* Definição de cores específicas para cada botão (laser e fundo) */
        .link-btn.whatsapp { --brand-color: #25D366; --brand-color-rgb: 37, 211, 102; }
        .link-btn.tiktok { --brand-color: #FE2C55; --brand-color-rgb: 254, 44, 85; }
        .link-btn.instagram { --brand-color: #E1306C; --brand-color-rgb: 225, 48, 108; }

        /* Cores de brilho dinâmicas quando o laser termina */
        .link-btn.ready {
            border-color: rgba(var(--brand-color-rgb), 0.5);
            background: linear-gradient(90deg, rgba(var(--brand-color-rgb), 0.12) 0%, rgba(255,255,255,0.02) 100%);
            box-shadow: 0 4px 20px rgba(var(--brand-color-rgb), 0.15);
            opacity: 1;
        }

        /* --- EFEITO LASER --- */
        .laser-pointer {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background-color: #FFF;
            /* A cor do laser puxa automaticamente a cor da marca do botão */
            box-shadow: 0 0 8px 1px var(--brand-color), 0 0 15px 3px rgba(var(--brand-color-rgb), 0.5);
            vertical-align: text-bottom;
            animation: flicker 0.05s infinite alternate;
            margin-left: 3px;
        }

        @keyframes flicker {
            0% { opacity: 0.8; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 12px 2px #fff, 0 0 20px 5px var(--brand-color); }
        }

        .laser-text-container {
            flex: 1;
            display: flex;
            align-items: center;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <!-- CONTAINER PRINCIPAL -->
    <main class="w-full max-w-md mx-auto px-6 pt-12 pb-8 flex flex-col flex-1 relative z-10">
        
        <!-- HEADER / PERFIL -->
        <div class="flex flex-col items-center text-center mb-10">
            <!-- Container da Logo com um brilho radial amarelo no fundo -->
            <div class="w-48 h-48 mb-2 relative flex items-center justify-center">
                <div class="absolute inset-0 bg-brandGold opacity-[0.15] blur-2xl rounded-full"></div>
                
                <!-- Logo carregada diretamente do Imgur -->
                <img src="https://i.imgur.com/q1aVoPk.jpeg" alt="Tudo com Laser" class="relative z-10 w-full h-full object-cover rounded-full border border-brandGold/20 shadow-[0_0_15px_rgba(255,179,0,0.1)]">
            </div>
            
            <h1 class="sr-only">Tudo com Laser</h1> <!-- Oculto visualmente, mas bom para o Google/SEO -->
            <p class="text-neutral-400 text-[11px] mt-3 font-medium tracking-[0.15em] uppercase">Links Oficiais</p>
        </div>

        <!-- LINKS COM EFEITO LASER -->
        <div class="flex flex-col gap-4 w-full" id="links-container">
            <!-- WhatsApp -->
            <a href="https://wa.me/5581992064543?text=Olá! Vim pelo link da bio e gostaria de solicitar um orçamento." target="_blank" class="link-btn whatsapp">
                <i class="ph-light ph-whatsapp-logo text-[24px] text-[#25D366]"></i>
                <div class="laser-text-container" data-text="Falar no WhatsApp"></div>
            </a>
            <!-- TikTok -->
            <a href="https://www.tiktok.com/@tudocomlaser?_r=1&_t=ZG-98hGpKNnpPU" target="_blank" class="link-btn tiktok">
                <i class="ph-light ph-tiktok-logo text-[24px] text-[#FE2C55]"></i>
                <div class="laser-text-container" data-text="Siga no TikTok"></div>
            </a>
            <!-- Instagram -->
            <a href="https://www.instagram.com/tudocomlaser/" target="_blank" class="link-btn instagram">
                <i class="ph-light ph-instagram-logo text-[24px] text-[#E1306C]"></i>
                <div class="laser-text-container" data-text="Nosso Instagram"></div>
            </a>
        </div>

    </main>

    <!-- SCRIPTS (EFEITO LASER) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initLaserEffect();
        });

        // --- LÓGICA DO EFEITO LASER ---
        function initLaserEffect() {
            const textContainers = document.querySelectorAll('.laser-text-container');
            
            textContainers.forEach((container, index) => {
                const fullText = container.getAttribute('data-text');
                setTimeout(() => {
                    typeTextWithLaser(container, fullText);
                }, 400 + (index * 800)); 
            });

            function typeTextWithLaser(container, text) {
                container.innerHTML = '<span class="text-content"></span><span class="laser-pointer"></span>';
                const textSpan = container.querySelector('.text-content');
                const laser = container.querySelector('.laser-pointer');
                
                let i = 0;
                const typing = setInterval(() => {
                    if (i < text.length) {
                        textSpan.textContent += text.charAt(i);
                        i++;
                    } else {
                        clearInterval(typing);
                        laser.style.transition = 'opacity 0.2s ease-out';
                        laser.style.opacity = '0';
                        setTimeout(() => laser.remove(), 200);
                        const parentButton = container.closest('.link-btn');
                        if (parentButton) parentButton.classList.add('ready');
                    }
                }, 40); 
            }
        }
    </script>
</body>
</html>
