<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tudo com Laser | Links</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: '#000000', 
                        bgCard: '#0A0A0A', 
                        brandGold: '#FFB300'
                    },
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #000000;
            color: #F8FAFC;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 179, 0, 0.15) 0%, transparent 50%);
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04; 
            pointer-events: none;
            z-index: 0;
        }

        /* --- BOTÕES PREMIUM & FOGUETÃO --- */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            height: 64px; /* Altura fixa para manter a simetria ao encolher para círculo */
            padding: 0 24px;
            border-radius: 16px;
            font-weight: 500;
            font-size: 15px;
            letter-spacing: 0.3px;
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            opacity: 0.5; /* Começa meio transparente até o laser terminar */
            cursor: pointer;
            text-align: left;
            box-sizing: border-box;
            margin: 0 auto;
        }

        .link-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.05);
        }
        .link-btn:active {
            transform: scale(0.98);
        }

        /* Brilho quando o laser termina, usando as variáveis de cor de cada botão */
        .link-btn.ready {
            border-color: rgba(var(--brand-color-rgb), 0.4);
            background: linear-gradient(90deg, rgba(var(--brand-color-rgb), 0.08) 0%, rgba(255,255,255,0.02) 100%);
            box-shadow: 0 4px 20px rgba(var(--brand-color-rgb), 0.1);
            opacity: 1;
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            transition: opacity 0.2s ease, transform 0.4s ease;
        }

        .rocket-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0) translateY(20px);
            opacity: 0;
            color: #FFFFFF;
            font-size: 28px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        /* --- ANIMAÇÃO DE DESCOLAGEM (ROCKET LAUNCH) --- */
        .link-btn.launching {
            width: 64px !important;
            padding: 0 !important;
            border-radius: 50% !important;
            background: rgba(var(--brand-color-rgb), 0.9) !important;
            border-color: rgba(255, 255, 255, 0.6) !important;
            box-shadow: 0 15px 35px rgba(var(--brand-color-rgb), 0.8), 0 0 20px rgba(255, 255, 255, 0.3) !important;
            pointer-events: none;
            z-index: 50; 
            animation: launchSequence 1s cubic-bezier(0.55, 0.085, 0.68, 0.53) 0.5s forwards;
        }

        .link-btn.launching .btn-content {
            opacity: 0;
            transform: scale(0.5);
        }

        .link-btn.launching .rocket-icon {
            transform: translate(-50%, -50%) scale(1) translateY(0);
            opacity: 1;
            animation: rocketRumble 0.1s linear infinite 0.4s;
        }

        @keyframes launchSequence {
            0% { transform: translateY(0) scale(1); }
            20% { transform: translateY(8px) scale(0.95); } 
            100% { transform: translateY(-1000px) scale(0.5); opacity: 0; } 
        }

        @keyframes rocketRumble {
            0% { transform: translate(-50%, -50%) scale(1) rotate(-4deg); }
            50% { transform: translate(-50%, -50%) scale(1) rotate(4deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(-4deg); }
        }

        /* --- EFEITO LASER (Cores Dinâmicas) --- */
        .laser-text-container {
            flex: 1;
            display: flex;
            align-items: center;
            min-height: 24px;
        }

        .laser-pointer {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background-color: #FFF;
            box-shadow: 0 0 8px 1px var(--brand-color), 0 0 15px 3px rgba(var(--brand-color-rgb), 0.5);
            vertical-align: text-bottom;
            animation: flicker 0.05s infinite alternate;
            margin-left: 3px;
        }

        @keyframes flicker {
            0% { opacity: 0.8; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 12px 2px #fff, 0 0 20px 5px var(--brand-color); }
        }
    </style>
</head>
<body>

    <main class="w-full max-w-md mx-auto px-6 pt-16 pb-8 flex flex-col flex-1 relative z-10">
        
        <!-- HEADER / LOGO -->
        <div class="flex flex-col items-center text-center mb-12">
            <!-- Container da Logo com brilho radial azul do Verificado -->
            <div class="w-[140px] h-[140px] mb-3 relative flex items-center justify-center">
                <div class="absolute inset-0 bg-[#0095F6] opacity-[0.25] blur-2xl rounded-full"></div>
                
                <!-- Nova Logo Redonda com Borda Azul e Sombra -->
                <img src="https://i.imgur.com/q1aVoPk.jpeg" alt="Tudo com Laser" class="relative z-10 w-full h-full object-cover rounded-full border-[3px] border-[#0095F6] shadow-lg shadow-[#0095F6]/40">
                
                <!-- Selo de Verificado (Meta) Oficial -->
                <div class="absolute bottom-[10px] right-[10px] z-20 w-[24px] h-[24px] bg-white rounded-full flex items-center justify-center">
                    <!-- Desenho exato (SVG) do selo azul -->
                    <svg class="w-[32px] h-[32px] text-[#0095F6] absolute" fill="currentColor" viewBox="0 0 40 40">
                        <path d="M19.998 3.094 14.638 0l-2.972 5.15H5.432v6.354L0 14.64 3.094 20 0 25.359l5.432 3.137v5.905h5.975L14.638 40l5.36-3.094L25.358 40l3.232-5.6h6.162v-6.01L40 25.359 36.905 20 40 14.641l-5.248-3.03v-6.46h-6.419L25.358 0l-5.36 3.094Zm7.415 11.225 2.254 2.287-11.43 11.5-6.835-6.93 2.244-2.258 4.587 4.581 9.18-9.18Z"></path>
                    </svg>
                </div>
            </div>
            
            <h1 class="sr-only">Tudo com Laser</h1>
            <p class="text-neutral-400 text-[11px] mt-2 font-medium tracking-[0.15em] uppercase">Links Oficiais</p>
        </div>

        <!-- LINKS COM EFEITO LASER & FOGUETÃO -->
        <div class="flex flex-col gap-4 w-full" id="links-container">
            
            <!-- WhatsApp (Verde) -->
            <!-- Usamos CSS variables online style para definir a cor específica de cada laser -->
            <a href="https://wa.me/5581992064543?text=Olá! Vim pelo link da bio e gostaria de solicitar um orçamento." class="link-btn" style="--brand-color: #25D366; --brand-color-rgb: 37, 211, 102;">
                <div class="btn-content">
                    <i class="ph-light ph-whatsapp-logo text-[26px] text-[#25D366]"></i>
                    <div class="laser-text-container" data-text="Falar no WhatsApp"></div>
                </div>
                <i class="ph-fill ph-rocket-launch rocket-icon"></i>
            </a>

            <!-- TikTok (Vermelho TikTok) -->
            <a href="https://www.tiktok.com/@tudocomlaser?_r=1&_t=ZG-98hGpKNnpPU" class="link-btn" style="--brand-color: #FE2C55; --brand-color-rgb: 254, 44, 85;">
                <div class="btn-content">
                    <i class="ph-light ph-tiktok-logo text-[26px] text-[#FE2C55]"></i>
                    <div class="laser-text-container" data-text="Siga no TikTok"></div>
                </div>
                <i class="ph-fill ph-rocket-launch rocket-icon"></i>
            </a>

            <!-- Instagram (Magenta) -->
            <a href="https://www.instagram.com/tudocomlaser/" class="link-btn" style="--brand-color: #E1306C; --brand-color-rgb: 225, 48, 108;">
                <div class="btn-content">
                    <i class="ph-light ph-instagram-logo text-[26px] text-[#E1306C]"></i>
                    <div class="laser-text-container" data-text="Nosso Instagram"></div>
                </div>
                <i class="ph-fill ph-rocket-launch rocket-icon"></i>
            </a>
            
        </div>
    </main>

    <!-- SCRIPTS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initLaserEffect();
            initRocketLaunch();
        });

        // --- LÓGICA DO EFEITO LASER ---
        function initLaserEffect() {
            const textContainers = document.querySelectorAll('.laser-text-container');
            
            textContainers.forEach((container, index) => {
                const fullText = container.getAttribute('data-text');
                setTimeout(() => {
                    typeTextWithLaser(container, fullText);
                }, 300 + (index * 700)); // Escreve um a seguir ao outro
            });

            function typeTextWithLaser(container, text) {
                container.innerHTML = '<span class="text-content"></span><span class="laser-pointer"></span>';
                const textSpan = container.querySelector('.text-content');
                const laser = container.querySelector('.laser-pointer');
                
                let i = 0;
                const typing = setInterval(() => {
                    if (i < text.length) {
                        textSpan.textContent += text.charAt(i);
                        i++;
                    } else {
                        clearInterval(typing);
                        laser.style.transition = 'opacity 0.2s ease-out';
                        laser.style.opacity = '0';
                        setTimeout(() => laser.remove(), 200);
                        
                        // Liga o brilho do botão
                        const parentButton = container.closest('.link-btn');
                        if (parentButton) parentButton.classList.add('ready');
                    }
                }, 40); 
            }
        }

        // --- LÓGICA DA DESCOLAGEM DO FOGUETÃO ---
        function initRocketLaunch() {
            const links = document.querySelectorAll('.link-btn');
            
            links.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault(); 
                    
                    const url = this.getAttribute('href');
                    if (this.classList.contains('launching')) return; 
                    
                    this.classList.add('launching');
                    
                    // Espera pela animação de descolagem antes de redirecionar (~1.4 segundos)
                    setTimeout(() => {
                        window.location.href = url; 
                        
                        // Repõe o botão ao normal caso o utilizador volte à página com a seta de "Retroceder"
                        setTimeout(() => {
                            this.classList.remove('launching');
                        }, 500);
                    }, 1400);
                });
            });
        }
    </script>
</body>
</html>
